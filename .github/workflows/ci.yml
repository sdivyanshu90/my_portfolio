name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Golden router set, injection screen, retrieval, store, and the
      # credit-safety tests for /api/ask (no network, no API key).
      - run: npm test
      - run: npm run build
